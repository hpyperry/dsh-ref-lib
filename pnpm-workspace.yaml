# pnpm 11 依赖构建脚本批准名单（package.json 的 pnpm 字段已废弃，统一放这里）。
# koffi 是 cordis-plugin-loader 的原生 FFI 依赖；pnpm 11 默认 strictDepBuilds=true，
# 不批准会令 `pnpm install` 以 ERR_PNPM_IGNORED_BUILDS 失败。
allowBuilds:
  koffi: true
# 只在 pnpm 的 minimumReleaseAge 生效时才起作用（本机当前没设，等于不生效）。集合 =
# lockfile 里全部 `@deepseek-ai/*@<devDependencies 钉的版本>`，换钉版本时整节跟着换。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.2.0-rc.2'
  - '@deepseek-ai/dsh-agent-preset-registry@0.2.0-rc.2'
